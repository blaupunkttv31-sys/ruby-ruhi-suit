<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suit Finder</title>

<style>
body {
    font-family: 'Segoe UI';
    background: linear-gradient(135deg,#ff758c,#ff7eb3);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.container {
    background: white;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    width: 300px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

h2 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
    margin-bottom: 15px;
}

button {
    padding: 10px 20px;
    border: none;
    background: #ff4b7d;
    color: white;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #e43c6f;
}
</style>
</head>

<body>

<div class="container">
    <h2>👗 Suit Finder</h2>
    <input type="text" id="input" placeholder="Type Ruby or Ruhi...">
    <button onclick="search()">Find Suit</button>
</div>

<script>
function search() {
    let value = document.getElementById("input").value.toLowerCase();

    if (value === "ruby") {
        window.location.href = "https://www.meesho.com/s/p/7nybn1?utm_source=s_cc";
    } 
    else if (value === "ruhi") {
        window.location.href = "https://www.meesho.com/s/p/gwgrt8?utm_source=s_cc";
    } 
    else {
        alert("❌ No suit found! Try Ruby or Ruhi");
    }
}
</script>

</body>
</html>
